<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <h1>Todo List</h1>
            <div id="projects"></div>
            <button id="add-project">+ Add Project</button>
        </aside>

        <main id="content">
            <h2 id="project-title">Default</h2>
            <div id="todos"></div>
            <button id="add-todo">+ Add Todo</button>

            <form id="todo-form" hidden>
                <input id="todo-title" type="text" placeholder="Title" required>

                <textarea id="todo-description" placeholder="Description" required></textarea>

                <input id="todo-date" type="date" required>

                <select id="todo-priority" required>
                    <option value="">Priority</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>

                <button type="submit">Save Todo</button>
            </form>

        </main>
    </div>
     
</body>
</html>
